version: '1.0'
name: epistemic-dj
ai_id: epistemic-dj
description: 'Music taste profiling & generation system.


  epistemic-dj analyzes music sources and listener preferences to build

  epistemic profiles of musical taste. LLM-powered curation, mixing, and

  matching against those profiles. Eventually: algorithmic music composition

  and digital creation grounded in learned taste models.


  Core capabilities:

  - Music source analysis (metadata, audio features, contextual signals)

  - Listener epistemic profiling (taste, mood, genre affinity, discovery vectors)

  - LLM-driven curation (matching listener profiles to sources)

  - Mix/match composition (create playlists and mashups from profiles)

  - Future: generative music creation (compose new music matching taste profiles)

  '
