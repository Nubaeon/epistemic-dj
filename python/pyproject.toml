[project]
name = "epistemic-dj"
version = "0.1.0"
description = "Bandcamp integration, stem separation, and epistemic taste-profiling for epistemic-dj. Complements the existing JS MCP server (src/) which handles epistemic-state-to-sound generation."
readme = "../README.md"
requires-python = ">=3.12"  # bandcamp-async-api requires >=3.12
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.7",
    "httpx>=0.27",
    # Python-native, actively maintained (125 commits/13 releases through
    # May 2026). No official Bandcamp API covers personal collections --
    # this wraps cookie/identity_token auth, the pattern the whole
    # unofficial ecosystem has converged on. See docs/dev/architecture.md.
    "bandcamp-async-api>=0.2.2",
    # Real audio-feature extraction (BPM, energy, spectral features) --
    # replaces metadata/title-only reasoning, which David correctly
    # identified as unreliable (findings f21/decision d26). Pure pip,
    # no system binary needed (unlike aubio CLI, which the JS side uses
    # but isn't installed here).
    "librosa>=0.10",
]

[project.scripts]
epistemic-dj-mcp = "epistemic_dj.mcp_server:main"

[project.optional-dependencies]
separation = [
    # Stem separation deps are heavy (torch etc.) and GPU-dependent -- kept
    # optional so `uv sync` stays fast for anyone just working on the
    # Bandcamp/taste-profiling layers. Install with `uv sync --extra separation`.
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "pyright>=1.1",
    # musdb: NOT a full-dataset download. musdb.DB(download=True) fetches
    # only the ~10MB 7-second-excerpt sample set (MUSDB18's own
    # quick-eval/prototyping mode) -- legitimate, free, tiny. Full
    # MUSDB18HQ (real separation-quality benchmarking) is a separate,
    # deliberate download from Zenodo, not something tests pull automatically.
    "musdb>=0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
include = ["epistemic_dj", "tests"]
typeCheckingMode = "basic"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
